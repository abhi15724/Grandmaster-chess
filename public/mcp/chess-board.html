<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{font-family:system-ui;margin:0;padding:16px;background:#fff;color:#222}.wrap{max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:10px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;overflow:hidden;border-radius:12px}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,48px);cursor:pointer}.light{background:#f0d9b5}.dark{background:#b58863}.selected{outline:4px solid #3b82f6;outline-offset:-4px}.target{box-shadow:inset 0 0 0 5px #22c55e}.status{margin:8px 0;font-weight:600}button{padding:8px 12px;border:0;border-radius:8px}.moves{font-size:13px;opacity:.8;margin-top:8px}</style></head><body><div class="wrap"><div class="top"><strong>Grandmaster Chess</strong><div><select id="level"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option><option value="master">Master</option></select><button id="new">Play AI</button><button id="analyze">Analyze</button></div></div><div id="status" class="status">Loading…</div><div id="board" class="board"></div><div id="moves" class="moves"></div></div><script>
let state=null,selected=null,targets=[];
const P={wp:"♙",wn:"♘",wb:"♗",wr:"♖",wq:"♕",wk:"♔",bp:"♟",bn:"♞",bb:"♝",br:"♜",bq:"♛",bk:"♚"};
const host=()=>window.openai;
async function callTool(name,args={}){if(host()?.callTool)return host().callTool(name,args);throw new Error("MCP App bridge unavailable");}
function pieces(f){let o=[];for(const r of f.split(" ")[0].split("/"))for(const c of r){if(/[1-8]/.test(c))for(let i=0;i<+c;i++)o.push(null);else o.push(c)}return o}
function sq(i){return"abcdefgh"[i%8]+(8-Math.floor(i/8))}
function render(){const e=document.getElementById("board");e.innerHTML="";pieces(state.fen).forEach((p,i)=>{const d=document.createElement("div"),s=sq(i);d.className="sq "+((Math.floor(i/8)+i)%2?"dark":"light");if(s===selected)d.classList.add("selected");if(targets.includes(s))d.classList.add("target");if(p)d.textContent=P[(p===p.toUpperCase()?"w":"b")+p.toLowerCase()];d.onclick=()=>click(s);e.appendChild(d)});document.getElementById("status").textContent=state.status+" • "+(state.turn==="w"?"White":"Black")+" to move";document.getElementById("moves").textContent=state.history.map((m,i)=>(i%2===0?(Math.floor(i/2)+1)+". ":"")+m.san).join(" ")}
async function click(s){if(!selected){try{const r=await callTool("get_legal_chess_moves",{gameId:state.gameId,square:s});targets=(r?.structuredContent?.moves||[]).map(x=>x.to);selected=s;render()}catch{}return}if(s===selected){selected=null;targets=[];render();return}try{const r=await callTool("play_chess_vs_ai",{gameId:state.gameId,from:selected,to:s,difficulty:document.getElementById("level").value});state=r.structuredContent;selected=null;targets=[];render()}catch{selected=null;targets=[];render()}}
document.getElementById("analyze").onclick=async()=>{if(!state)return;try{const r=await callTool("analyze_chess_game",{gameId:state.gameId,difficulty:document.getElementById("level").value});const x=r.structuredContent||{};document.getElementById("status").textContent="Analysis: "+(x.summary?.blunders||0)+" blunders • "+(x.summary?.mistakes||0)+" mistakes • "+(x.summary?.inaccuracies||0)+" inaccuracies";document.getElementById("moves").textContent=(x.issues||[]).map(i=>"Move "+i.ply+" "+i.move+": "+i.classification+" — "+i.message+(i.bestMove?" Best: "+i.bestMove:"")).join("\n")||"No classified inaccuracies at this engine depth."}catch(e){document.getElementById("status").textContent="Analysis unavailable";}}
document.getElementById("new").onclick=async()=>{const r=await callTool("start_ai_chess_game",{difficulty:document.getElementById("level").value});state=r.structuredContent;selected=null;targets=[];render()};
(async()=>{try{const r=await callTool("start_ai_chess_game",{difficulty:"intermediate"});state=r.structuredContent;render()}catch{document.getElementById("status").textContent="Use this board from an MCP Apps-compatible ChatGPT host."}})();
</script></body></html>
